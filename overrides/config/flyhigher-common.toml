#Fly Higher - Air Pressure Configuration
[pressure]
	#Height scale multiplier. Scales altitude distances from the 1.0 atm anchor point.
	#1.0 = default, 2.0 = double height range, 0.5 = half height range
	# Default: 1.0
	# Range: 0.1 ~ 5.0
	heightMultiplier = 1.0

#Fly Higher - Dimension Adaptation
[dimensions]
	#Apply the pressure curve to dimensions that do not provide their own Sable dimension_physics data.
	#The 1.0 atm anchor is placed at each dimension's sea level.
	#Dimensions with an explicit datapack entry (including Fly Higher's Overworld entry) are left alone.
	adaptOtherDimensions = true
