[recipes]
	#Enable the shapeless crafting-table recipes even when Create is installed.
	#When false, those recipes are enabled only if Create is absent. Reload recipes after changing this value.
	alwaysEnableCraftingTableRecipes = false

[items]
	#Maximum uses of a Copper Coating bottle.
	# Default: 128
	# Range: 1 ~ 1000000
	waxMaxUse = 128
	#Maximum uses of an Oxidiser bottle.
	# Default: 128
	# Range: 1 ~ 1000000
	oxiMaxUse = 128
