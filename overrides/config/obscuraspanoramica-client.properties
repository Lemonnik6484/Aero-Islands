# Obscura's Panoramica - client settings
#
# panoramaResolution: edge length in pixels of each of the six square panorama images.
#   -1 = auto: the larger side of the game window's framebuffer.
#   Any other value is clamped to 64..4096.
#   Both are also limited to the largest image the graphics card can render.
panoramaResolution=-1
#
# screenshotDelay: warm-up before the capture, in client ticks (20 ticks = 1 second) per direction.
#   The camera faces each of the six directions this long, so the world in every direction is
#   ready to be drawn. Raise it if the images show missing chunks. 1..100, default 5.
screenshotDelay=5
